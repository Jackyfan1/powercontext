app:
  description: 把客人的每句话调成一杯有名字的酒，并用 seekdb 的向量 + 全文混合检索记住他们。Dify 负责编排与对话，seekdb 负责长期记忆。
  icon: 🍸
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: 深夜记忆调酒馆
  use_icon_as_answer_icon: false
dependencies: []
kind: app
site:
  chat_color_theme: null
  chat_color_theme_inverted: false
  copyright: null
  custom_disclaimer: ''
  default_language: zh-Hans
  description: null
  icon: 🍸
  icon_background: '#FFEAD5'
  icon_type: emoji
  input_placeholder: null
  privacy_policy: null
  show_workflow_steps: true
  title: 深夜记忆调酒馆
  use_icon_as_answer_icon: false
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: 调酒馆后端根地址（不带结尾斜杠）。Docker 自托管用 host.docker.internal，同机进程用 127.0.0.1。
    id: bar-base-url
    name: BAR_BASE_URL
    selector:
    - env
    - BAR_BASE_URL
    value: http://host.docker.internal:8787
    value_type: string
  features:
    file_upload:
      enabled: false
    opening_statement: |-
      欢迎光临 **深夜记忆调酒馆**。

      我是调酒师阿浮。你今晚说的每一句话，都会被我调成一杯酒，收进 seekdb 的酒柜里。

      告诉我今天发生了什么——或者只是说一句「我累了」也可以。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 今天加班到很晚，有点想家
    - 我第一次来，这里有什么酒？
    - 看看我的酒柜
    - 打烊吧，晚安
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: http-request
      id: start-to-recall
      source: start
      sourceHandle: source
      target: recall
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: http-request
      id: recall-to-remember
      source: recall
      sourceHandle: source
      target: remember
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: answer
      id: remember-to-answer
      source: remember
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables: []
      height: 90
      id: start
      position:
        x: 30
        y: 260
      positionAbsolute:
        x: 30
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: body_json
            key: ''
            type: text
            value: '{"query":"{{#sys.query#}}","user_id":"{{#sys.user_id#}}","top_k":4}'
          type: json
        default_value:
        - key: body
          type: string
          value: '酒馆的灯暂时熄灭了：请先启动 seekdb 调酒后端（见 README 第 4.2 节），或在应用环境变量里检查 BAR_BASE_URL。'
        - key: status_code
          type: number
          value: 0
        - key: headers
          type: object
          value: {}
        desc: 在 seekdb 里做向量 + 全文混合检索，直接返回调酒师要说的完整回复
        error_strategy: default-value
        headers: 'Content-Type: application/json'
        method: post
        params: ''
        retry_config:
          enabled: true
          exponential_backoff:
            enabled: false
            max_interval: 10000
            multiplier: 2
          max_retries: 2
          retry_interval: 1000
        selected: false
        timeout:
          connect: 5
          read: 20
          write: 20
        title: 查阅酒柜
        type: http-request
        url: '{{#env.BAR_BASE_URL#}}/v1/recall_text'
        variables: []
      height: 120
      id: recall
      position:
        x: 330
        y: 260
      positionAbsolute:
        x: 330
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: body_json
            key: ''
            type: text
            value: '{"user_id":"{{#sys.user_id#}}","text":"{{#sys.query#}}"}'
          type: json
        default_value:
        - key: body
          type: string
          value: '{"stored": false}'
        - key: status_code
          type: number
          value: 0
        - key: headers
          type: object
          value: {}
        desc: 把客人今晚的话写回 seekdb，供下次召回；写入失败只跳过，不阻断对话
        error_strategy: default-value
        headers: 'Content-Type: application/json'
        method: post
        params: ''
        retry_config:
          enabled: true
          exponential_backoff:
            enabled: false
            max_interval: 10000
            multiplier: 2
          max_retries: 2
          retry_interval: 1000
        selected: false
        timeout:
          connect: 5
          read: 20
          write: 20
        title: 封存记忆
        type: http-request
        url: '{{#env.BAR_BASE_URL#}}/v1/remember'
        variables: []
      height: 120
      id: remember
      position:
        x: 630
        y: 260
      positionAbsolute:
        x: 630
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#recall.body#}}'
        desc: ''
        selected: false
        title: 直接回复
        type: answer
        variables: []
      height: 100
      id: answer
      position:
        x: 930
        y: 260
      positionAbsolute:
        x: 930
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
  rag_pipeline_variables: []
